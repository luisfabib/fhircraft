site_name: Fhircraft
site_url: https://github.com/luisfabib/fhircraft
repo_url: https://github.com/luisfabib/fhircraft
repo_name: luisfabib/fhircraft
copyright: Copyright &copy; 2024 - 2025 Luis Fábregas-Ibáñez and contributors

theme:
  icon:
    repo: fontawesome/brands/github
  favicon: assets/images/favicon.png
  logo: assets/logo_white.svg
  name: material
  features:
    - content.code.copy
    - content.code.annotate
    - navigation.expand
    - navigation.path   
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.sections 
  palette:
    # Palette toggle for automatic mode
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default 
      primary: pink
      accent: pink
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: pink
      toggle:
        icon: material/brightness-4
        name: Switch to system preference

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github 
      link: https://github.com/luisfabib/fhircraft
    - icon: fontawesome/brands/python 
      link: https://pypi.org/project/fhircraft/

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences

plugins:
  - search
  - literate-nav:
      nav_file: SUMMARY.md
  - gen-files:
      scripts:
        - scripts/gen_ref_pages.py
        - scripts/gen_credits_page.py
        - scripts/gen_repo_pages.py
  - mkdocstrings:
      handlers:
        python:
          docstring_section_style: google
          docstring_options:
            ignore_init_summary: true
          merge_init_into_class: true
          separate_signature: true
          signature_crossrefs: true
          import:
            - https://docs.python.org/3/objects.inv
            - https://docs.pydantic.dev/latest/objects.inv
          options:
            extensions:
              - griffe_fieldz:
                  include_inherited: true
